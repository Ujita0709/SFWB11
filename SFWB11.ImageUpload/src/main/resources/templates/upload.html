<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ファイルアップロード</title>
<style>
  .gallery {
  	display: flex;
  	flex-wrap: wrap;
  	gap: 20px;
  }
  
  .image-wrapper {
  	max-width: 400px;
  }
  
  .image-wrapper img {
  	width: 100%;
  }
</style>
</head>
<body>
<h1>ファイルアップロード</h1>
<p>画像ファイルをアップロードしてください</p>
<form th:action="@{/upload}" method="post" enctype="multipart/form-data">
  <p>ファイル：<input type="file" name="upfile" accept="image/*"></p>
  <p><input type="submit" value="アップロード"></p>
</form>

<p><a href="/">一覧へ</a></p>
</body>
</html>
