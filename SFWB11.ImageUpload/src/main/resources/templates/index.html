<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ファイルアップロード</title>
<style>
  .gallery {
  	display: flex;
  	flex-wrap: wrap;
  	gap: 20px;
  }
  
  .image-wrapper {
  	max-width: 400px;
  }
  
  .image-wrapper img {
  	width: 100%;
  }
</style>
</head>
<body>
	<h1>画像リスト</h1>

	  <!-- データが空のとき -->
	  <p class="empty" th:if="${#lists.isEmpty(items)}">登録された画像がありません。</p>

	  <!-- 一覧 -->
	  <div class="gallery" th:if="${!#lists.isEmpty(items)}">
	    <div class="card" th:each="item : ${items}">
	      <a th:href="@{/detail/{id}(id=${item.id})}">
	        <img class="thumb" th:src="@{/gallery/{img}(img=${item.imgSrc})}"
	             th:alt="${item.name != null ? item.name : '画像'}">
	      </a>
	      <div class="meta">
	        <div class="name" th:text="${item.name}">ファイルの説明</div>
	        <div class="memo" th:text="${item.memo}">メモ</div>
	      </div>
	      <div class="actions">
	        <a class="btn" th:href="@{/detail/{id}(id=${item.id})}">詳細を見る</a>
	      </div>
	    </div>
	  </div>
</body>
</html>
