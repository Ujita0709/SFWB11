<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>詳細表示</title>
</head>
<body>

  <h1 th:text="${item.name}">タイトル</h1>
  <img th:src="@{/gallery/{img}(img=${item.imgSrc})}" alt="画像" style="width:400px;">
  <p>メモ: <span th:text="${item.memo}"></span></p>

  <form th:action="@{/edit/{id}(id=${item.id})}" method="post">
    <p>表示名: <input type="text" name="name" th:value="${item.name}"></p>
    <p>メモ: <input type="text" name="memo" th:value="${item.memo}"></p>
    <p>（任意）ファイル名変更: <input type="text" name="newFileName" th:value="${item.imgSrc}"></p>
    <input type="submit" value="編集を保存">
  </form>

  <p>
    <a th:href="@{/delete/{id}(id=${item.id})}">削除</a> |
    <a href="/">一覧に戻る</a>
  </p>

</body>
</html>
