<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>編集</title>
</head>
<body>
<h1>編集</h1>
<form th:action="@{/edit/{id}(id=${item.id})}" method="post">
  <p>表示名: <input type="text" name="name" th:value="${item.name}"></p>
  <p>メモ: <input type="text" name="memo" th:value="${item.memo}"></p>
  <p>ファイル名変更: <input type="text" name="newFileName" th:value="${item.imgSrc}"></p>
  <input type="submit" value="保存">
</form>
<p><a th:href="@{/detail/{id}(id=${item.id})}">戻る</a></p>
</body>
</html>
